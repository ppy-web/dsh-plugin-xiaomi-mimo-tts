# Xiaomi MiMo TTS for DSH Web.
# The one row activates both the Host half and the package's dsh.client Web half.
- insert:
    - id: xiaomi-mimo-tts
      name: 'dsh-xiaomi-tts'
      config:
        enabled: true
        apiKey: ''
        baseURL: 'https://api.xiaomimimo.com/v1'
        model: 'mimo-v2.5-tts'
        voice: '冰糖'
        voiceDesignPrompt: '青年女性，声线清亮、亲切自然，吐字清楚，语速适中，情绪温柔克制。'
        voiceDesignCustomPrompt: '青年女性，声线清亮、亲切自然，吐字清楚，语速适中，情绪温柔克制。'
        presetStylePrompt: '使用清晰、自然、准确的声音朗读，语速适中，停顿自然，语气平和克制，避免夸张表达。'
        format: 'pcm'
        autoPlay: false
        soundEnabled: false
        taskSounds: false
        clickSounds: false
        instruction: '请忠实朗读原文，根据文本语气自然表达，不添加或改写内容。'
        maxTextLength: 12000
        requestTimeoutMs: 120000
        maxMp3AudioBytes: 33554432
        maxWavAudioBytes: 134217728
        maxPausedPcmBytes: 33554432

# Optional QQ transport. Generic synthesis and tools do not depend on QQBot.
- insert:
    - id: speech-delivery-qqbot
      name: 'dsh-xiaomi-tts/qqbot'
      disabled: true

# Optional companion preset: a whale maid with file, web, and question tools.
- insert:
    - id: preset-whale-girl
      name: 'dsh-xiaomi-tts/whale-girl'
      disabled: true
      config:
        id: whale-girl
        name: '鲸鱼娘'
        description: '白饭续航、机灵嘴硬，会一本正经接梗，也会温柔陪伴和可靠办事的鲸鱼娘女仆助手。'
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js >-
                (() => { const require = process.getBuiltinModule('node:module').createRequire(new URL('index.js', baseUrl)); const path = process.getBuiltinModule('node:path'); const root = path.dirname(require.resolve('dsh-xiaomi-tts/package.json')); return require(path.join(root, 'skills', 'whale-girl', 'persona.cjs'))(root); })()
              complete: true
              includeRuntimeContext: true

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
