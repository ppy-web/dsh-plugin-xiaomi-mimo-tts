# Xiaomi MiMo TTS for DSH Web.
# The one row activates both the Host half and the package's dsh.client Web half.
- insert:
    - id: xiaomi-mimo-tts
      name: 'dsh-xiaomi-tts'
      config:
        enabled: true
        apiKey: ''
        baseURL: 'https://api.xiaomimimo.com/v1'
        model: 'mimo-v2.5-tts'
        voice: '冰糖'
        voiceDesignPrompt: '青年女性，声线清亮、亲切自然，吐字清楚，语速适中，情绪温柔克制。'
        voiceDesignCustomPrompt: '青年女性，声线清亮、亲切自然，吐字清楚，语速适中，情绪温柔克制。'
        presetStylePrompt: '使用清晰、自然、准确的声音朗读，语速适中，停顿自然，语气平和克制，避免夸张表达。'
        format: 'pcm'
        autoPlay: false
        soundEnabled: false
        taskSounds: false
        clickSounds: false
        instruction: '请忠实朗读原文，根据文本语气自然表达，不添加或改写内容。'
        maxTextLength: 12000
        requestTimeoutMs: 120000
        maxMp3AudioBytes: 33554432
        maxWavAudioBytes: 134217728
        maxPausedPcmBytes: 33554432

# Optional companion preset: a whale maid with local memory tools.
- insert:
    - id: preset-whale-girl
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: whale-girl
        name: '鲸鱼娘'
        description: '会陪伴、会吐槽、也会认真办事的鲸鱼娘女仆助手。'
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js >-
                process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(new URL('index.js', baseUrl)).resolve('dsh-xiaomi-tts/package.json')), 'skills', 'whale-girl', 'SKILL.md'), 'utf8').replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '')
              complete: true
              includeRuntimeContext: true

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
