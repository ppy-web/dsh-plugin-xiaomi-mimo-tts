name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack --dry-run
      - name: Pack compatibility artifact
        run: pnpm pack
      - name: Smoke test DSH 0.1.1-rc.2
        env:
          DSH_COMPAT_VERSION: 0.1.1-rc.2
        run: node scripts/dsh-compat-smoke.mjs dsh-xiaomi-tts-*.tgz
      - name: Smoke test DSH 0.1.2-rc.1
        env:
          DSH_COMPAT_VERSION: 0.1.2-rc.1
        run: node scripts/dsh-compat-smoke.mjs dsh-xiaomi-tts-*.tgz
