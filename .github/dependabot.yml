version: 2
# Version notifications are maintained by workflows/dependency-report.yml.
# Security alerts and security update PRs are controlled in repository settings.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
